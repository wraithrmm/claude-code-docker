vulnerabilities:
  # Go binary vulnerabilities - cannot be patched in place, need upstream rebuilds.
  # These suppress HIGH/CRITICAL findings in compiled Go binaries we install from
  # upstream (terraform, tflint, dockerd, docker-compose). They are TEMPORARY, held
  # until upstream ships releases compiled with patched Go stdlib / modules.
  # Tools install latest available; the affected-binary list reflects what is actually
  # present in the image (terraform-docs and the standalone trivy binary were removed).
  #
  # terraform binary - HashiCorp go-getter arbitrary file read vulnerability
  - id: CVE-2025-8959
    statement: Cannot patch compiled Go binary, using latest available version
  # terraform binary - database/sql Postgres race condition
  - id: CVE-2025-47907
    statement: Cannot patch compiled Go binary, using latest available version
  # Go stdlib HostnameError.Error() vulnerability - affects terraform, tflint
  - id: CVE-2025-61729
    statement: Cannot patch compiled Go binary, awaiting upstream release with Go 1.25.5+
  # sigstore timestamp-authority vulnerability - affects tflint
  - id: CVE-2025-66564
    statement: Cannot patch compiled Go binary, awaiting upstream release with fixed sigstore lib

  # glob CLI command injection - FALSE POSITIVE for npm
  # npm uses glob as a library, not CLI. The vulnerable -c/--cmd code path is never executed.
  # See: https://github.com/npm/cli/issues/8741
  - id: CVE-2025-64756
    statement: FALSE POSITIVE - npm uses glob library interface, not CLI. Vulnerable code path never executed.

  # node-tar vulnerabilities - npm transitive dependency
  # npm 11.8.0 ships tar@7.5.4, fixes require tar@7.5.7+. No npm release available yet.
  - id: CVE-2026-23745
    statement: npm transitive dependency (tar@7.5.4), awaiting npm release with tar@7.5.7+
  - id: CVE-2026-23950
    statement: npm transitive dependency (tar@7.5.4), awaiting npm release with tar@7.5.7+
  - id: CVE-2026-24842
    statement: npm transitive dependency (tar@7.5.4), awaiting npm release with tar@7.5.7+

  # @isaacs/brace-expansion ReDoS - global npm transitive dependency
  # Fixed in 5.0.1, but locked at 5.0.0 by upstream global package dependency trees.
  # Local /workspace packages patched via npm overrides in Dockerfile.
  # See: https://avd.aquasec.com/nvd/cve-2026-25547
  - id: CVE-2026-25547
    statement: Global npm transitive dependency (brace-expansion@5.0.0), awaiting upstream package release with >=5.0.1

  # Go stdlib vulnerabilities - net/url and archive/zip
  # Affects tflint, docker-compose
  # Requires upstream releases compiled with Go 1.24.12+ or 1.25.6+
  - id: CVE-2025-61726
    statement: Cannot patch compiled Go binary, awaiting upstream release with Go 1.24.12+ or 1.25.6+
  - id: CVE-2025-61728
    statement: Cannot patch compiled Go binary, awaiting upstream release with Go 1.24.12+ or 1.25.6+

  # Go stdlib crypto/tls vulnerabilities
  # Affects dockerd, terraform, tflint, docker-compose
  # Requires upstream releases compiled with Go 1.24.13+ or 1.25.7+
  - id: CVE-2025-68121
    statement: Cannot patch compiled Go binary, awaiting upstream release with Go 1.24.13+ or 1.25.7+
  - id: CVE-2025-61730
    statement: Cannot patch compiled Go binary, awaiting upstream release with Go 1.24.12+ or 1.25.6+

  # OpenTelemetry Go SDK - Arbitrary Code Execution via PATH Hijacking
  # Affects dockerd, tflint, docker-compose (compiled Go binaries)
  # Requires upstream releases with otel/sdk 1.40.0+
  - id: CVE-2026-24051
    statement: Cannot patch compiled Go binary, awaiting upstream release with go.opentelemetry.io/otel/sdk 1.40.0+

  # gRPC-Go authorization bypass via improper HTTP/2 path validation
  # Affects dockerd, terraform, tflint, docker-compose (compiled Go binaries)
  # Low exploitability: these are CLI tools, not gRPC servers with path-based AuthZ deny rules
  # Requires upstream releases compiled with google.golang.org/grpc 1.79.3+
  - id: CVE-2026-33186
    statement: Cannot patch compiled Go binary. Low risk — affects gRPC server-side AuthZ, these tools use gRPC as clients. Awaiting upstream releases with grpc 1.79.3+

  # Go stdlib net/url incorrect parsing of IPv6 host literals
  # Affects tflint — compiled Go binary
  # Docker Engine 29.3.1 and Terraform 1.14.8 already ship Go 1.25.8 (fixed)
  - id: CVE-2026-25679
    statement: Cannot patch compiled Go binary, awaiting upstream release with Go 1.25.8+ or 1.26.1+

  # Moby AuthZ plugin bypass when provided oversized request bodies
  # Affects docker-compose (compiled Go binary using docker/docker client library)
  # Not exploitable: CVE targets dockerd server-side AuthZ plugin; docker-compose only uses the client SDK
  # Docker Engine 29.3.1 includes the fix for dockerd itself
  - id: CVE-2026-34040
    statement: Cannot patch compiled Go binary. Not exploitable — CVE affects dockerd AuthZ server, docker-compose uses the docker client SDK only. Awaiting upstream release with docker 29.3.1+

  # BuildKit arbitrary file write and code execution via untrusted frontend
  # Affects docker-compose (buildkit v0.27.1) — compiled Go binary
  # Docker Engine 29.3.1 ships buildkit v0.28.1 (fixed for actual build execution)
  # docker-compose delegates builds to the engine's buildkit, so execution uses the patched engine version
  - id: CVE-2026-33747
    statement: Cannot patch compiled Go binary. Low risk — docker-compose delegates builds to the engine (patched). Awaiting upstream release with buildkit 0.28.1+

  # BuildKit unauthorized file access via Git URL fragment subdir components
  # Affects docker-compose (buildkit v0.27.1) — compiled Go binary
  # Same exploitability assessment as CVE-2026-33747 above
  - id: CVE-2026-33748
    statement: Cannot patch compiled Go binary. Low risk — docker-compose delegates builds to the engine (patched). Awaiting upstream release with buildkit 0.28.1+

  # === Go 1.25.9/1.26.2 + 1.25.10/1.26.3 security releases (scanned 2026-05-27) ===
  # Go stdlib crypto/x509 + crypto/tls DoS set (April 2026, fixed Go 1.25.9 / 1.26.2)
  # Affects docker-compose (compiled Go binary)
  # Fixed versions verified via pkg.go.dev/vuln (GO-2026-4947 / 4946 / 4870)
  - id: CVE-2026-32280
    statement: Not exploitable - x509/TLS chain-building DoS only reachable when verifying attacker-supplied client cert chains; these tools act as TLS clients, not cert-verifying servers. Cannot patch compiled Go binary, awaiting upstream release with Go 1.25.9+ or 1.26.2+
  - id: CVE-2026-32281
    statement: Low risk - x509 policy-validation DoS only reachable when verifying attacker-supplied chains to a trusted root; not a path these CLI tools exercise. Cannot patch compiled Go binary, awaiting upstream release with Go 1.25.9+ or 1.26.2+
  - id: CVE-2026-32283
    statement: Low risk - TLS 1.3 KeyUpdate deadlock requires connecting to a malicious TLS endpoint and only hangs a single short-lived CLI connection. Cannot patch compiled Go binary, awaiting upstream release with Go 1.25.9+ or 1.26.2+

  # Go stdlib net / net/http / net/mail set (May 2026, fixed Go 1.25.10 / 1.26.3)
  # Affects docker-compose (compiled Go binary)
  # Fixed versions verified via pkg.go.dev/vuln (GO-2026-4981 / 4918 / 4986 / 4971 / 4977)
  - id: CVE-2026-33811
    statement: Low risk - cgo DNS resolver double-free requires a cgo build plus an explicit LookupCNAME, neither typical for these pure-Go CLI binaries. Cannot patch compiled Go binary, awaiting upstream release with Go 1.25.10+ or 1.26.3+
  - id: CVE-2026-33814
    statement: Low risk - HTTP/2 client infinite loop requires connecting to a malicious HTTP/2 server and only impacts a single short-lived CLI run. Cannot patch compiled Go binary, awaiting upstream release with Go 1.25.10+ or 1.26.3+
  - id: CVE-2026-39820
    statement: Not exploitable - net/mail address parsing is not used by these tools. Cannot patch compiled Go binary, awaiting upstream release with Go 1.25.10+ or 1.26.3+
  - id: CVE-2026-39836
    statement: Not exploitable - Windows-only Dial/LookupPort panic; this image runs on Linux. Cannot patch compiled Go binary, awaiting upstream release with Go 1.25.10+ or 1.26.3+
  - id: CVE-2026-42499
    statement: Not exploitable - net/mail address parsing (consumePhrase) is not used by these tools. Cannot patch compiled Go binary, awaiting upstream release with Go 1.25.10+ or 1.26.3+

  # OpenTelemetry Go SDK kenv PATH hijacking bundled in docker-compose
  # Follow-up to CVE-2026-24051; vulnerable code path is BSD/Solaris-only
  - id: CVE-2026-39883
    statement: Not exploitable - vulnerable kenv code path is BSD/Solaris-only (host_id_bsd.go build tag) and not compiled on our Linux image; also requires local attacker PATH control. Cannot patch compiled Go binary, awaiting upstream release with go.opentelemetry.io/otel/sdk 1.43.0+

  # containerd runAsNonRoot evasion via CRI-plugin user-ID type confusion
  # Affects dockerd, docker-compose (compiled Go binaries)
  # Fixed containerd 2.2.4 / 2.0.9 / 2.3.1 (1.7.32 for the v1 module)
  - id: CVE-2026-46680
    statement: Low risk - affected code is containerd's CRI-plugin runAsNonRoot enforcement, a Kubernetes/kubelet runtime concern; docker-compose embeds containerd only as a library (API orchestration) and never runs the CRI user-ID path, and dockerd here is a single-tenant developer Docker-in-Docker engine, not a CRI node. Cannot patch compiled Go binary, awaiting upstream rebuilds with containerd 2.2.4+ (1.7.32+ for the v1 module)

  # Docker Engine daemon vulnerabilities matched against the docker/docker module in docker-compose
  # Vulnerable code is server-side in github.com/docker/docker/daemon (runs in dockerd); docker-compose
  # links the module only as a client SDK and never executes the daemon path (same basis as CVE-2026-34040)
  # Fixed engine-side in Docker Engine 29.5.1+ / moby v2.0.0-beta.14; no fix for the legacy module path
  # RESIDUAL RISK: these are real for the host Docker Engine - ensure hosts running dockerd are on Engine 29.5.1+
  - id: CVE-2026-41567
    statement: Not exploitable from this binary - RCE lives in the Docker Engine daemon (github.com/docker/docker/daemon) handling PUT /containers/archive; docker-compose links docker/docker only as a client SDK and does not run the daemon path. Fixed engine-side in Docker Engine 29.5.1+; no fix for the legacy module path. Patch the host engine separately.
  - id: CVE-2026-42306
    statement: Not exploitable from this binary - TOCTOU bind-mount redirection lives in the Docker Engine daemon (github.com/docker/docker/daemon) docker cp path; docker-compose links docker/docker only as a client SDK and does not run the daemon path. Fixed engine-side in Docker Engine 29.5.1+; no fix for the legacy module path. Patch the host engine separately.

  # === Surfaced by rebuild on 2026-06-24 (newer binaries + newer Trivy DB) ===
  # Go stdlib quadratic-DoS set (June 2026, fixed Go 1.25.11 / 1.26.4)
  # Affects terraform (Go 1.25.10), tflint (Go 1.26.3) — compiled Go binaries
  # Fixed versions verified via pkg.go.dev/vuln (GO-2026-5037 / 5038) + Go 1.25.11/1.26.4 release
  - id: CVE-2026-27145
    statement: Not exploitable - crypto/x509 VerifyHostname quadratic DoS only amplified when verifying an attacker-supplied cert carrying a very large DNS SAN list; these tools make outbound TLS only to trusted endpoints (registries, module sources) with small SANs and never verify adversarial certs. Cannot patch compiled Go binary, awaiting upstream release with Go 1.25.11+ or 1.26.4+
  - id: CVE-2026-42504
    statement: Not exploitable - mime WordDecoder.DecodeHeader quadratic DoS requires decoding attacker-controlled MIME/RFC2047 headers; terraform and tflint never parse email or MIME-encoded-word headers. Cannot patch compiled Go binary, awaiting upstream release with Go 1.25.11+ or 1.26.4+

  # containerd v2 CRI-plugin vulnerability set (June 2026, fixed containerd 2.2.5 / 2.3.2; also 2.1.9)
  # Affects dockerd (containerd/v2 v2.2.4) — compiled Go binary
  # All three are CRI-plugin (Kubernetes runtime) issues requiring pod-creation rights + a malicious
  # image/checkpoint; verified via containerd GitHub Security Advisories (GHSA-xhf5-7wjv-pqxp /
  # rgh6-rfwx-v388 / 33vj-92qq-66hc). dockerd here is a single-tenant developer Docker-in-Docker
  # engine with no CRI server, so the CRI-plugin paths are not reachable.
  - id: CVE-2026-53488
    statement: Not exploitable - containerd CRI-plugin image-LABEL-to-host command execution requires a running CRI server plus a host plugin consuming CRI labels; the dev DinD dockerd runs no CRI server. Cannot patch compiled Go binary, awaiting upstream rebuild with containerd 2.2.5+ / 2.3.2+
  - id: CVE-2026-53489
    statement: Not exploitable - containerd CRI-plugin checkpoint container.log symlink arbitrary file read requires CRI checkpoint/restore plus kubectl logs; not reachable from a dev DinD dockerd with no CRI server. Cannot patch compiled Go binary, awaiting upstream rebuild with containerd 2.2.5+ / 2.3.2+
  - id: CVE-2026-53492
    statement: Not exploitable - containerd CRI-plugin CDI annotation smuggling requires CRI + CDI enabled + checkpoint/restore on a multi-tenant node; none of these conditions exist for a dev DinD dockerd. Cannot patch compiled Go binary, awaiting upstream rebuild with containerd 2.2.5+ / 2.3.2+

